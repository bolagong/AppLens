<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AppLens 工作台</title>
    <style>
      :root { color-scheme: light; font-family: "PingFang SC", "Microsoft YaHei", Inter, ui-sans-serif, system-ui, sans-serif; background: #f4f6fb; color: #172033; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; }
      header { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 18px 24px; background: #18233d; color: #fff; }
      h1 { margin: 0; font-size: 18px; } h2 { margin: 0 0 12px; font-size: 16px; } h3 { margin: 0; font-size: 14px; }
      button, input, select, textarea { font: inherit; } button { cursor: pointer; border: 0; border-radius: 8px; padding: 9px 12px; background: #255ccf; color: #fff; font-weight: 650; }
      button.secondary { background: #e7ecf8; color: #172033; } button.danger { background: #bd334a; } button:disabled { opacity: .55; cursor: not-allowed; }
      .top-actions { display: flex; gap: 8px; flex-wrap: wrap; } .status { font-size: 13px; color: #b9c5e6; }
      main { display: grid; grid-template-columns: 270px minmax(320px, 1fr) minmax(360px, 1.25fr); gap: 16px; padding: 16px; max-width: 1700px; margin: auto; }
      section, aside { background: #fff; border: 1px solid #e1e6f2; border-radius: 12px; box-shadow: 0 2px 10px rgba(27, 40, 72, .04); }
      .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 16px; border-bottom: 1px solid #e8ecf5; }
      .function-list { margin: 0; padding: 8px; list-style: none; max-height: calc(100vh - 155px); overflow: auto; }
      .function-list button { width: 100%; text-align: left; background: transparent; color: #172033; padding: 11px; margin: 2px 0; font-weight: 500; }
      .function-list button:hover, .function-list button.active { background: #eaf0ff; color: #1748ad; }
      .tag { display: inline-block; margin-top: 4px; padding: 2px 6px; border-radius: 99px; background: #e9edf6; color: #56617a; font-size: 11px; }
      .content { padding: 16px; } .empty { padding: 36px 20px; text-align: center; color: #68738c; }
      label { display: block; margin: 12px 0 5px; color: #3d4962; font-size: 12px; font-weight: 700; } input, select, textarea { width: 100%; border: 1px solid #ccd4e5; border-radius: 7px; padding: 9px; background: #fff; color: #172033; }
      textarea { min-height: 74px; resize: vertical; line-height: 1.4; } .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
      .evidence { margin: 0; padding-left: 18px; color: #4c5872; font-size: 13px; } .evidence li { margin: 6px 0; }
      .shots { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; margin-top: 10px; }
      .shots a { display: block; color: #255ccf; font-size: 12px; overflow-wrap: anywhere; } .shots img { display: block; width: 100%; border-radius: 7px; border: 1px solid #dfe5f1; margin-bottom: 3px; }
      .overview { display: grid; gap: 12px; }.metric { background: #f5f7fc; border-radius: 9px; padding: 12px; }.metric strong { display: block; font-size: 21px; }
      .notice { padding: 10px 14px; font-size: 13px; background: #fff6dc; color: #765000; border-bottom: 1px solid #f1dc9b; display: none; }
      .notice.error { background: #ffeaed; color: #981c35; border-color: #fac5cf; } .hidden { display: none; }
      .footer-actions { display: flex; gap: 8px; padding-top: 16px; border-top: 1px solid #e8ecf5; margin-top: 18px; }
      @media (max-width: 1050px) { main { grid-template-columns: 240px 1fr; } #evidencePanel { grid-column: span 2; } }
      @media (max-width: 680px) { header { align-items: flex-start; flex-direction: column; } main { display: block; padding: 10px; } main > * { margin-bottom: 10px; } .function-list { max-height: 220px; } .row { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <header>
      <div><h1>AppLens 工作台</h1><div id="projectStatus" class="status">正在加载产品模型…</div></div>
      <div class="top-actions"><button class="secondary" id="refreshButton">刷新</button><button id="saveButton">保存模型</button><button id="confirmButton">确认最终版本</button></div>
    </header>
    <div id="notice" class="notice"></div>
    <main>
      <aside>
        <div class="panel-head"><h2>功能树</h2><button id="addFunction" title="添加功能">＋</button></div>
        <ul id="functionList" class="function-list"></ul>
      </aside>
      <section id="editorPanel"><div class="empty">请选择一个功能，或创建一个原创功能。</div></section>
      <section id="evidencePanel">
        <div class="panel-head"><h2>证据与视觉参考</h2><span class="tag">阅读证据，编辑决策</span></div>
        <div class="content">
          <div id="overview" class="overview"></div>
          <label for="visualNotes">视觉参考备注（每行一条）</label>
          <textarea id="visualNotes" placeholder="例如：紧凑卡片列表&#10;低饱和蓝色强调色&#10;卡片圆角 16 px"></textarea>
          <label for="visualDecisions">视觉决策 JSON</label>
          <textarea id="visualDecisions" placeholder='{"primary_color":"#3454D1","corner_radius":16}'></textarea>
          <div class="footer-actions"><button class="secondary" id="applyVisual">应用视觉编辑</button></div>
        </div>
      </section>
    </main>
    <script>
      const state = { model: null, selected: -1 };
      const requiredFields = ["name", "entry", "flow", "pages", "page_states", "interaction_rules", "competitor_evidence", "confidence", "product_decision", "modification_notes", "acceptance_criteria"];
      const byId = (id) => document.getElementById(id);
      const notice = (message, error = false) => { const el = byId("notice"); el.textContent = message; el.className = `notice${error ? " error" : ""}`; el.style.display = message ? "block" : "none"; };
      const lines = (value) => value.split("\n").map(v => v.trim()).filter(Boolean);
      const decisionLabels = { keep: "保留", modify: "修改", delete: "删除", add: "新增" };
      const confidenceLabels = { dynamically_verified: "动态验证", static_inference: "静态推断", unconfirmed: "未确认" };
      const statusLabels = { evidence_review: "证据审阅", model_review: "模型审阅", confirmed: "已确认" };
      const labelFor = (labels, value) => labels[value] || value;
      const functionTemplate = () => ({ name: "新增产品功能", entry: "", flow: [], pages: [], page_states: [], interaction_rules: [], competitor_evidence: [], confidence: "unconfirmed", product_decision: "add", modification_notes: "原创产品决策。", acceptance_criteria: [] });
      const ensureFunction = (item) => { requiredFields.forEach((field) => { if (!(field in item)) item[field] = Array.isArray(field === "flow" || field === "pages" || field === "page_states" || field === "interaction_rules" || field === "competitor_evidence" || field === "acceptance_criteria") ? [] : ""; }); return item; };
      async function api(url, options = {}) { const response = await fetch(url, options); const payload = await response.json().catch(() => ({})); if (!response.ok) throw new Error(payload.error || (payload.errors || []).join("; ") || `HTTP ${response.status}`); return payload; }
      async function refresh() { try { const { model } = await api("/api/model"); state.model = model; state.selected = model.functions.length ? Math.min(state.selected < 0 ? 0 : state.selected, model.functions.length - 1) : -1; render(); notice(""); } catch (error) { notice(error.message, true); } }
      function render() { const { model } = state; byId("projectStatus").textContent = `${model.project.name} · ${model.project.version || "未版本化"} · ${labelFor(statusLabels, model.project.status)}`; byId("visualNotes").value = (model.visual_model.reference_notes || []).join("\n"); byId("visualDecisions").value = JSON.stringify(model.visual_model.decisions || {}, null, 2); renderList(); renderEditor(); renderEvidence(); }
      function renderList() { const list = byId("functionList"); list.innerHTML = ""; state.model.functions.forEach((raw, index) => { const item = ensureFunction(raw); const li = document.createElement("li"); const button = document.createElement("button"); button.className = index === state.selected ? "active" : ""; button.innerHTML = `<strong>${escapeHtml(item.name || "未命名功能")}</strong><br><span class="tag">${escapeHtml(labelFor(decisionLabels, item.product_decision))} · ${escapeHtml(labelFor(confidenceLabels, item.confidence))}</span>`; button.onclick = () => { state.selected = index; renderList(); renderEditor(); }; li.appendChild(button); list.appendChild(li); }); }
      function escapeHtml(value) { const el = document.createElement("div"); el.textContent = value; return el.innerHTML; }
      function field(label, id, value, type = "text") { return `<label for="${id}">${label}</label>${type === "textarea" ? `<textarea id="${id}">${escapeHtml(value)}</textarea>` : `<input id="${id}" value="${escapeHtml(value)}" />`}`; }
      function renderEditor() { const panel = byId("editorPanel"); if (state.selected < 0) { panel.innerHTML = '<div class="empty">暂时没有功能。请从产品决策层新增一个功能。</div>'; return; } const item = ensureFunction(state.model.functions[state.selected]); panel.innerHTML = `<div class="panel-head"><h2>当前功能</h2><button class="danger" id="deleteFunction">删除</button></div><div class="content"><div class="row"><div>${field("功能名称", "functionName", item.name)}</div><div><label for="decision">产品决策</label><select id="decision">${["keep","modify","delete","add"].map(v => `<option value="${v}" ${item.product_decision === v ? "selected" : ""}>${labelFor(decisionLabels, v)}</option>`).join("")}</select></div></div><div class="row"><div><label for="confidence">置信度</label><select id="confidence">${["dynamically_verified","static_inference","unconfirmed"].map(v => `<option value="${v}" ${item.confidence === v ? "selected" : ""}>${labelFor(confidenceLabels, v)}</option>`).join("")}</select></div><div>${field("入口", "entry", item.entry)}</div></div>${field("流程（每行一个步骤）", "flow", item.flow.join("\n"), "textarea")}${field("页面（每行一个页面）", "pages", item.pages.join("\n"), "textarea")}${field("页面状态（每行一个状态）", "states", item.page_states.join("\n"), "textarea")}${field("交互规则（每行一条）", "rules", item.interaction_rules.join("\n"), "textarea")}${field("修改说明", "notes", item.modification_notes, "textarea")}${field("验收标准（每行一条）", "acceptance", item.acceptance_criteria.join("\n"), "textarea")}<label for="evidence">竞品证据 JSON</label><textarea id="evidence">${escapeHtml(JSON.stringify(item.competitor_evidence, null, 2))}</textarea><div class="footer-actions"><button id="applyFunction">应用功能编辑</button></div></div>`; byId("applyFunction").onclick = applyFunction; byId("deleteFunction").onclick = () => { state.model.functions.splice(state.selected, 1); state.selected = Math.max(0, state.selected - 1); render(); }; }
      function applyFunction() { try { const item = ensureFunction(state.model.functions[state.selected]); item.name = byId("functionName").value.trim(); item.product_decision = byId("decision").value; item.confidence = byId("confidence").value; item.entry = byId("entry").value.trim(); item.flow = lines(byId("flow").value); item.pages = lines(byId("pages").value); item.page_states = lines(byId("states").value); item.interaction_rules = lines(byId("rules").value); item.modification_notes = byId("notes").value.trim(); item.acceptance_criteria = lines(byId("acceptance").value); item.competitor_evidence = JSON.parse(byId("evidence").value || "[]"); if (!item.name) throw new Error("必须填写功能名称。"); renderList(); renderEvidence(); notice("功能编辑已在本地应用。请保存模型以持久化。"); } catch (error) { notice(`无法应用功能编辑：${error.message}`, true); } }
      function renderEvidence() { const observation = state.model.observations || {}; const shots = observation.screenshots || []; const paths = observation.navigation_paths || []; const functions = state.model.functions || []; byId("overview").innerHTML = `<div class="metric"><strong>${functions.length}</strong>个产品功能</div><div class="metric"><strong>${shots.length}</strong>张动态截图</div><div class="metric"><strong>${paths.length}</strong>条导航路径</div><div><h3>已观察证据</h3><ul class="evidence"><li>静态清单：${escapeHtml(observation.source_input?.static_evidence || "未关联")}</li><li>已拦截或跳过路径：${(observation.interception_points || []).length}</li></ul><div class="shots">${shots.slice(0, 12).map(shot => `<a target="_blank" rel="noopener" href="/output/${encodeURI(shot.screenshot)}">${shot.screenshot?.endsWith(".png") ? `<img src="/output/${encodeURI(shot.screenshot)}" alt="证据截图">` : ""}${escapeHtml(shot.id || shot.screenshot || "截图")}</a>`).join("")}</div></div>`; }
      async function save() { try { applyVisual(); const { model } = await api("/api/model", { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ model: state.model }) }); state.model = model; render(); notice("已保存到本地。"); return true; } catch (error) { notice(`保存失败：${error.message}`, true); return false; } }
      function applyVisual() { try { state.model.visual_model.reference_notes = lines(byId("visualNotes").value); state.model.visual_model.decisions = JSON.parse(byId("visualDecisions").value || "{}"); notice("视觉编辑已在本地应用。请保存模型以持久化。"); } catch (error) { notice(`视觉决策 JSON 无效：${error.message}`, true); throw error; } }
      async function confirmFinal() { const version = prompt("确认最终产品模型版本（例如 v1.0）：", state.model.project.version || "v1.0"); if (!version) return; try { if (!await save()) return; const { model } = await api("/api/confirm", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ version }) }); state.model = model; render(); notice(`版本 ${version} 已确认。现在可以生成 docs/PRD.md。`); } catch (error) { notice(`确认失败：${error.message}`, true); } }
      byId("refreshButton").onclick = refresh; byId("saveButton").onclick = save; byId("confirmButton").onclick = confirmFinal; byId("addFunction").onclick = () => { state.model.functions.push(functionTemplate()); state.selected = state.model.functions.length - 1; render(); notice("已在本地新增原创功能。请保存模型以持久化。"); }; byId("applyVisual").onclick = applyVisual;
      refresh();
    </script>
  </body>
</html>
